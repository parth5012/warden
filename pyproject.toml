[project]
name = "aegis"
version = "0.1.0"
description = "AI Agent Governance & Human Accountability"
authors = [
    { name = "parth5012", email = "parthchawla5012@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.3.0",
    "langchain-core>=1.0.0",
    "typing-extensions>=4.12.0",
    "langchain-openai>=0.3.0",
    "pydantic-settings>=2.15.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.4",
    "openai>=1.0.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.12",
    "sqlglot>=30.22.0",
]

[project.optional-dependencies]
dev = [
    "openai>=1.0.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.10",
    "pgserver>=0.1.4",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests", "backend", "frontend"]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.uv.build-backend]
module-name = "warden"

[[tool.mypy.overrides]]
module = "app.*"
ignore_errors = true
